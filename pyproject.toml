[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "terrahour"
dynamic = ["version"]
description = "World clock, world map and 24-hour meeting planner for the terminal"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alessio Coci" }]
keywords = ["world clock", "time zones", "tui", "terminal", "timezone", "meeting planner", "tmux"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pillow"]

[project.scripts]
terrahour = "terrahour.cli:main"

[project.urls]
Homepage = "https://github.com/ACoci86/terrahour"
Issues = "https://github.com/ACoci86/terrahour/issues"

[tool.setuptools]
packages = ["terrahour"]

[tool.setuptools.dynamic]
version = { attr = "terrahour.__version__" }

[tool.setuptools.package-data]
terrahour = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
